name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar componentes
        run: |
          chmod +x tools/fetch_components.sh gradlew
          tools/fetch_components.sh
      - name: Apontar o SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilar
        run: ./gradlew assembleModernDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wow-forever-debug-apk
          path: app/build/outputs/apk/modern/debug/*.apk
